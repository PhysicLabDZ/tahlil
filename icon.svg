<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="التحليل الكهربائي">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5675"/>
      <stop offset="1" stop-color="#08202f"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3aa9d6" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="ionO" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff1e4"/>
      <stop offset=".5" stop-color="#ff9b6b"/>
      <stop offset="1" stop-color="#e03b17"/>
    </radialGradient>
    <radialGradient id="ionB" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset=".5" stop-color="#6fbaff"/>
      <stop offset="1" stop-color="#1c63d6"/>
    </radialGradient>
    <clipPath id="glass">
      <path d="M118 176 H394 V386 a30 30 0 0 1 -30 30 H148 a30 30 0 0 1 -30 -30 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#7CFF4F" stroke-opacity=".55" stroke-width="4"/>

  <!-- الأسلاك -->
  <path d="M204 84 C204 34 150 30 128 64" fill="none" stroke="#ff3b30" stroke-width="9" stroke-linecap="round"/>
  <path d="M308 84 C308 34 362 30 384 64" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <path d="M308 84 C308 34 362 30 384 64" fill="none" stroke="#7CFF4F" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- الكأس: السائل -->
  <g clip-path="url(#glass)">
    <rect x="110" y="250" width="290" height="180" fill="url(#liq)"/>
    <ellipse cx="256" cy="250" rx="140" ry="8" fill="#d8f6ff" fill-opacity=".55"/>
  </g>

  <!-- القطبان -->
  <rect x="190" y="92" width="32" height="286" rx="6" fill="#1b1b1f"/>
  <rect x="290" y="92" width="32" height="286" rx="6" fill="#1b1b1f"/>
  <rect x="186" y="70" width="40" height="30" rx="7" fill="#e5322b"/>
  <rect x="286" y="70" width="40" height="30" rx="7" fill="#2a2a2e"/>
  <rect x="195" y="96" width="4" height="270" rx="2" fill="#fff" fill-opacity=".12"/>
  <rect x="295" y="96" width="4" height="270" rx="2" fill="#fff" fill-opacity=".12"/>

  <!-- فقاعات عند المصعد -->
  <g fill="none" stroke="#e4ff7a" stroke-width="3" stroke-opacity=".95">
    <circle cx="172" cy="352" r="9"/><circle cx="238" cy="326" r="7"/><circle cx="176" cy="296" r="6"/>
    <circle cx="236" cy="278" r="9"/><circle cx="170" cy="262" r="5"/>
  </g>

  <!-- ترسّب شجري عند المهبط -->
  <g fill="none" stroke="#f4f7fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 346 L262 326 L240 330 M262 326 L254 300 M262 326 L250 346"/>
    <path d="M290 300 L268 286 L248 288 M268 286 L262 266"/>
    <path d="M290 372 L270 360 L252 366"/>
  </g>

  <!-- شوارد -->
  <circle cx="352" cy="336" r="17" fill="url(#ionO)" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/>
  <path d="M345 336 h14 M352 329 v14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="352" cy="288" r="14" fill="url(#ionB)" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/>
  <path d="M345.5 288 h13" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="140" cy="326" r="14" fill="url(#ionB)" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/>
  <path d="M133.5 326 h13" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- زجاج الكأس -->
  <path d="M118 176 H394 V386 a30 30 0 0 1 -30 30 H148 a30 30 0 0 1 -30 -30 Z" fill="#fff" fill-opacity=".06" stroke="#eaf9ff" stroke-opacity=".85" stroke-width="6" stroke-linejoin="round"/>
  <path d="M118 176 L98 160" stroke="#eaf9ff" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/>
  <path d="M142 200 V380" stroke="#fff" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
  <path d="M376 210 V300" stroke="#fff" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/>
</svg>
